*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#app{max-width:760px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#9333ea,#ec4899);color:#fff;border-radius:18px;padding:10px 14px;margin-bottom:14px}
header h1{font-size:18px;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:linear-gradient(135deg,#9333ea,#ec4899);color:#fff}
button.s{background:var(--ln);color:var(--tx)}header button{background:#ffffff33;padding:6px 12px}

.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}

.ok{color:var(--ok)}.ko{color:var(--ko)}.mu{color:var(--mu);font-size:14px}
.blank{border-bottom:3px solid var(--k);padding:0 18px}
.q{font-size:20px;margin:8px 0 14px}
.rv{border-top:1px solid var(--ln);padding:7px 0;font-size:15px}
.big{font-size:44px;font-weight:800;background:linear-gradient(135deg,#9333ea,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.rep{border:3px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#9333ea,#ec4899) border-box}
.rb{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;margin:8px 0}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#222}.card{break-inside:avoid}}

function begin(){const n=n_.value.trim(),a=a_.value.trim(),c=c_.value.trim();if(!n||!a||!c){er.textContent='Rellena nombre, apellidos y curso.';return}S.n=n;S.a=a;S.c=c;save();go('map')}
const n_={get value(){return document.getElementById('n').value}},a_={get value(){return document.getElementById('a').value}},c_={get value(){return document.getElementById('c').value}};
function lvl(l){if(!open_(l))return;const r=S.res[l];if(r&&r.done){cur={l};go('result');return}S.res[l]={a:[],c:[],s:0,done:false};cur={l,i:0,st:'in'};go('quiz')}
function redo(l){S.res[l]={a:[],c:[],s:0,done:false};cur={l,i:0,st:'in'};save();go('quiz')}
function conf(){const v=document.getElementById('v').value.trim();if(!v){document.getElementById('er').textContent='Escribe una respuesta.';return}S.res[cur.l].a[cur.i]=v;cur.st='lock';save();draw()}
function chg(){S.res[cur.l].c[cur.i]=1;cur.st='in';save();draw()}
function nx(){if(cur.i<19){cur.i++;cur.st='in';draw();return}const r=S.res[cur.l];r.s=Q[cur.l].filter((q,i)=>good(cur.l,i,r.a[i]||'')).length;r.done=true;save();go('result')}
draw();
</script></body></html>
