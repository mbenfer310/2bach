{k:"second",title:"Second conditional (Type 2)",form:["if + past simple","would + infinitive"],use:"Unreal or unlikely situations in the present or the future. With be, use were for every person.",ex:"If I earned more money, I would buy a motorbike.",
 say:"The second conditional is for unreal or unlikely situations in the present or the future. We use if plus the past simple, and then would plus the infinitive. For example: if I earned more money, I would buy a motorbike. With the verb be, we usually say were for every person: if I were you, I would think it over."},
{k:"third",title:"Third conditional (Type 3)",form:["if + past perfect","would have + past participle"],use:"Imaginary situations in the past: things that did not happen and cannot change.",ex:"If you had come to the lecture, you would have enjoyed it.",

{k:"tips",title:"Two last tips",form:null,use:"Unless means if not, so never put a negative verb after it. Provided that, providing and as long as mean only if.",ex:"Unless you study, you won't pass. = If you don't study, you won't pass.",

["Type 2","Unreal or unlikely present or future","if + past simple (were for all persons)","would + infinitive (also could, might)","If I earned more money, I would buy a motorbike."],
["Type 3","Unreal past, cannot change","if + past perfect","would have + past participle (also could have, might have)","If you had come, you would have enjoyed it."]];

let VOICE=null,run=0;
function pickVoice(){try{const v=speechSynthesis.getVoices(),gb=v.filter(x=>/en[-_]GB/i.test(x.lang));
  const pref=["Google UK English Female","Serena","Kate","Martha","Hazel","Stephanie","Fiona","Libby","Sonia"];
  VOICE=pref.map(n=>gb.find(x=>x.name.includes(n))).find(Boolean)||gb.find(x=>/female/i.test(x.name))||gb[0]||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}

function speak(text,done){
  if(!("speechSynthesis" in window)){toast("Voice is not available on this device. Read the subtitles instead.");return}
  stopSpeech();const my=run;const u=new SpeechSynthesisUtterance(text);
  u.lang="en-GB";if(VOICE)u.voice=VOICE;u.pitch=1.35;u.rate=.98;
  const end=()=>{if(my!==run)return;document.body.classList.remove("talking");done&&done()};
  u.onend=end;u.onerror=end;document.body.classList.add("talking");

  }else{
    y+=14;tx("FINAL MARK",14,10,1,MU);y+=11;tx(`${m} / 10`,14,26,1,GD);tx(band(m),196,14,1,P,"right");y+=5;bar(14,182,m/10,P);y+=14;
    [1,2].forEach(l=>{need(22);tx(`Level ${l}: ${LV[l].name}`,14,12,1);tx(`${right(l)} / 20  ·  ${(right(l)/2).toFixed(1)} / 10`,196,11,1,GD,"right");y+=4.5;bar(14,182,right(l)/20,P);y+=12});
    need(40);tx("Results by conditional type",14,12,1);y+=7;
    TAGKEYS.forEach(k=>{tx(TAGS[k],14,10);y-=3;bar(40,120,T[k][1]?T[k][0]/T[k][1]:0,P);y+=3;tx(`${T[k][0]} / ${T[k][1]}`,196,10,1,INK,"right");y+=7});
    y+=4;[1,2].forEach(l=>{need(30);tx(`Question map · Level ${l}`,14,12,1);y+=5;
      LV[l].q.forEach((q,i)=>{const c=S.ans[l][i]===q.ok?GD:BD,x=14+i*9.1;D.setFillColor(...c);D.roundedRect(x,y,8,8,1.6,1.6,"F");tx(i+1,x+4,8,1,[255,255,255],"center")});
      y+=15});
    tx("Dark violet = correct · Pink = wrong",14,8.5,0,MU);y+=10;
    const wrong=[];[1,2].forEach(l=>LV[l].q.forEach((q,i)=>{if(S.ans[l][i]!==q.ok)wrong.push([l,i])}));
    need(16);tx(`Corrections (${wrong.length})`,14,12,1);y+=6;
    if(!wrong.length){tx("No mistakes. Well done!",14,10);y+=6}
    wrong.forEach(([l,i])=>{const q=LV[l].q[i],a=S.ans[l][i];
      const mine=l===1?q.t.replace("___",q.o[a].x):q.o[a].x;
      const lines=[...(l===2?D.splitTextToSize("Original: "+q.t,172):[]),...D.splitTextToSize("Your answer: "+mine,172),...D.splitTextToSize("Correct: "+fillAns(l,i),172)];
      need(lines.length*4.4+9);tx(`Level ${l} · Question ${i+1}  (${TAGS[q.tag]})`,14,9.5,1,GD);y+=4.6;
      D.setFont("helvetica","normal");D.setFontSize(9);D.setTextColor(...INK);lines.forEach(s=>{D.text(s,18,y);y+=4.4});y+=2.5})}
  const clean=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
  const filename=`2BACH_Conditionals_${clean(S.user.s)}_${clean(S.user.n)}${fin?"":"_in_progress"}.pdf`;
  try{const dl=await claude.use("downloads");
    if(dl){await dl.save({filename,data:new Uint8Array(D.output("arraybuffer"))});toast("PDF ready.")}
    else toast("Downloads are not available in this view.")}
  catch(e){if(!e||e.code!=="declined")toast("The PDF could not be saved.")}}

/* ---------- Actions ---------- */
const ACT={
  home(){go(S.user?"home":"start")},lesson(){go("lesson")},report(){showCorr=false;go("report")},
  table(){openDrawer("t")},words(){openDrawer("w")},close(){$("#ov").hidden=true},tab(v){tab(v)},
  pdf(){makePDF()},edit(){go("start")},
  lv(v){S.lv=+v;save();$("#ov").hidden=true;go("quiz")},
  finish(){if(!all()){toast("Answer all 40 questions first.");return}go("confirm")},
  finishYes(){if(!all())return;S.finished=true;showCorr=true;save();go("report")},
  pick(v){if(S.finished)return;S.ans[S.lv][S.k[S.lv]]=+v;save();render(true)},
  jump(v){S.k[S.lv]=+v;save();render()},
  prev(){S.k[S.lv]=Math.max(0,S.k[S.lv]-1);save();render()},
  next(){S.k[S.lv]=Math.min(19,S.k[S.lv]+1);save();render()},
  corr(){showCorr=!showCorr;render(true)},
  listen(){const q=LV[S.lv].q[S.k[S.lv]];speak(qText(q,S.lv))},
  say(v){speak(v)},stop(){stopSpeech();setSub("Okay, I'll wait here. Press play when you're ready.")},
  playAll(){playSeg(0,true)},
  seg(v){const s=LES.find(x=>x.k===v);setSub(s.say);speak(s.say);const el=$("#s-"+v);document.querySelectorAll(".les.on").forEach(x=>x.classList.remove("on"));el.classList.add("on")}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset.v);
  if(e.target.id==="ov")ACT.close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)ACT.close()});
document.addEventListener("submit",e=>{if(e.target.id!=="f")return;e.preventDefault();
  const n=$("#fn").value.trim(),s=$("#sn").value.trim(),c=$("#co").value.trim();
  if(!n||!s||!c){$("#err").textContent="Please write your first name, your surname(s) and your course.";return}
  S.user={n,s,c};save();go("home")});
window.addEventListener("pagehide",stopSpeech);
render();
</script>
