<style>
/* Layout concept: Duolingo-style learning path (left nav on desktop, bottom bar on phones) with a focused full-screen lesson layer: text pane + question pane. Copy the cat is the guide, reader and mood indicator. */
:root{

    --sun:#ffd256; --sun-deep:#c79a1c; --sun-ink:#2e2200;
    --ok-bg:#1c3a22; --ok-ink:#a9e8b3; --bad-bg:#40201f; --bad-ink:#ffb4b0; --bad:#ff6b6b; --bad-deep:#c94545;
    --cat-gray:#9aa3af; --cat-line:#5a616c; color-scheme:dark;

}
:root[data-theme="dark"]{

  --leaf:#4cc364; --leaf-deep:#2c9442; --leaf-ink:#08210f;
  --sun:#ffd256; --sun-deep:#c79a1c; --sun-ink:#2e2200;
  --ok-bg:#1c3a22; --ok-ink:#a9e8b3; --bad-bg:#40201f; --bad-ink:#ffb4b0; --bad:#ff6b6b; --bad-deep:#c94545;
  --cat-gray:#9aa3af; --cat-line:#5a616c; color-scheme:dark;
}
*{box-sizing:border-box}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px;flex-wrap:wrap}

.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;font-weight:800;font-size:.78rem;color:var(--muted)}

}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:16px;padding:10px 22px;font-family:var(--f-display);font-weight:800;font-size:1.08rem;letter-spacing:.05em;text-transform:uppercase;min-height:48px;text-align:center}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 var(--leaf-deep)}

.btn.ghost{background:var(--surface);border-color:var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px}

.chip{display:inline-block;background:var(--surface-2);color:var(--leaf);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
/* Copy */
.copy{width:var(--sz,120px);height:auto;overflow:visible;flex:none}
.copy .fur{fill:var(--cat-fur);stroke:var(--cat-line);stroke-width:3;stroke-linejoin:round}
.copy .pink{fill:var(--cat-pink)}
.copy .gray{fill:var(--cat-gray)}
.copy .stripe{fill:none;stroke:var(--cat-gray);stroke-width:5;stroke-linecap:round}

.copy .mc{fill:none;stroke:var(--cat-eye);stroke-width:2.5;stroke-linecap:round}

.copy .tongue{fill:#ee8397}
.copy .whisk{stroke:var(--cat-line);stroke-width:2;stroke-linecap:round}

.copy .bell{fill:var(--sun);stroke:var(--sun-deep);stroke-width:2}

.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;max-width:30ch}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

.node svg{width:40px;height:40px}

.node.report{background:var(--surface-2);color:var(--leaf);box-shadow:0 7px 0 var(--line);border:2px solid var(--line)}

.nlabel{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.nsub{font-size:.9rem;color:var(--muted)}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px}
.stars .off{opacity:.25}
.link{width:6px;height:28px;border-radius:3px;background:var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}

input.t{width:100%;font:700 1.05rem var(--f-body);padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}

#lesson[hidden]{display:none}
.lhead{display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:1080px;width:100%;margin:0 auto}
.xbtn{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.xbtn svg{width:22px;height:22px}
.bar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.lscroll{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lbody{max-width:1080px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.lbody .textpanel{display:none}
.lbody.showtext .textpanel,.lbody.readonly .textpanel{display:block}
.toggletext{display:inline-flex}
@media (min-width:900px){
  .lbody.two{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:start}
  .lbody .textpanel{display:block}
  .toggletext{display:none}
  .lbody.two .textpanel{position:sticky;top:0}
}
.textcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px;font-size:1.1rem;line-height:1.75;max-width:70ch}
.textcard h2{font-size:1.5rem;margin-bottom:8px}
.sent{border-radius:8px;padding:1px 2px;transition:background .2s}
.sent sup{font:800 .62em var(--f-body);color:var(--muted);margin-right:3px}
.sent.now{background:var(--sun);color:var(--sun-ink)}
.sent.now sup{color:var(--sun-ink)}
.tphead{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qpanel{display:grid;gap:16px;align-content:start;max-width:620px}
.qpanel h2{font-size:1.6rem}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line);font-weight:700;min-height:54px}

.opt.sel .k{border-color:var(--leaf);color:var(--leaf)}

.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}

.spk svg{width:20px;height:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800}

.rgrid{display:grid;gap:16px}
.gradebox{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:8px solid var(--leaf);font-family:var(--f-display);font-weight:800;font-size:2.6rem;font-variant-numeric:tabular-nums;flex:none}

.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto}
.empty{display:grid;gap:12px;justify-items:start}
.note{font-size:.9rem;color:var(--muted)}
.msg{font-weight:800;color:var(--bad-ink);background:var(--bad-bg);border-radius:12px;padding:8px 12px}
</style>

let AC=null;
function beep(ok){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;const notes=ok?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.12);g.gain.exponentialRampToValueAtTime(.14,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.16);o.connect(g);g.connect(AC.destination);o.start(t+i*.12);o.stop(t+i*.12+.18)});
  }catch(e){}
}
const TTS=('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window)?window.speechSynthesis:null;
let VOICE=null,TOK=0,TALKING=false,SLOW=false;
function pickVoice(){
  if(!TTS)return;
  const vs=TTS.getVoices().filter(v=>/^en[-_]/i.test(v.lang));if(!vs.length)return;
  const pref=[/google uk english female/i,/samantha/i,/aria/i,/jenny/i,/sonia/i,/libby/i,/zira/i,/karen/i,/tessa/i,/serena/i,/female/i];
  for(const p of pref){const v=vs.find(x=>p.test(x.name));if(v){VOICE=v;return}}
  VOICE=vs.find(v=>/GB|AU|IE/i.test(v.lang))||vs[0];
}
if(TTS){pickVoice();TTS.onvoiceschanged=pickVoice}
function talkRoot(){const l=$('#lesson');return l&&!l.hidden?l:document}
function setTalking(on){TALKING=on;talkRoot().querySelectorAll('.copy').forEach(c=>c.classList.toggle('talking',on));const b=$('#btn-listen');if(b)refreshListen(b)}
function refreshListen(b){b.innerHTML=TALKING?`${I.stop} Stop`:`${I.speaker} Listen with Copy`}
function mark(i){$$('.sent').forEach((e,k)=>e.classList.toggle('now',k===i))}
function stopSpeak(){TOK++;if(TTS)TTS.cancel();setTalking(false);mark(-1)}
function speak(list,hooks){
  if(!TTS)return;hooks=hooks||{};
  TTS.cancel();const my=++TOK;let i=0;setTalking(true);
  const finish=()=>{if(my===TOK){setTalking(false);mark(-1);hooks.end&&hooks.end()}};
  const next=()=>{
    if(my!==TOK)return;if(i>=list.length){finish();return}
    const u=new SpeechSynthesisUtterance(list[i]);
    if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='en-GB';
    u.pitch=1.45;u.rate=SLOW?.78:1.02;u.volume=1;
    u.onstart=()=>{if(my===TOK&&hooks.sent)hooks.sent(i)};
    u.onend=()=>{if(my!==TOK)return;i++;next()};
    u.onerror=()=>finish();
    TTS.speak(u);
  };
  next();
}

function report(){

   <section class="card"><h2 style="font-size:1.3rem;margin-bottom:8px">Resultados por texto</h2><div class="tblw"><table class="tbl"><thead><tr><th>Texto</th><th>Aciertos</th><th>Nota</th></tr></thead><tbody>
    ${TEXTS.map(T=>{const r=S.results[T.id];return `<tr><td>${esc(T.title)}</td><td>${r?`${r.correct}/${r.total}`:'-'}</td><td>${r?(r.correct/r.total*10).toFixed(1).replace('.',','):'Pendiente'}</td></tr>`}).join('')}
    <tr><td>Vocabulary booster (práctica)</td><td>${S.vocab?`${S.vocab.correct}/${S.vocab.total}`:'-'}</td><td>No cuenta en la nota</td></tr></tbody></table></div></section>
   <section class="card"><h2 style="font-size:1.3rem;margin-bottom:4px">Valoración por criterios</h2><p class="note" style="margin-bottom:12px">Competencia específica 1 de Lengua Extranjera en 2º de Bachillerato (LOMLOE): comprender e interpretar textos escritos.</p>
    <div class="rgrid">${R.crit.map(c=>`<div class="crit"><div class="top2"><span>Criterio ${c.code} · ${esc(c.title)}</span><span>${c.t?`${c.c}/${c.t} · ${c.lvl}`:'Sin datos'}</span></div><div class="meter" role="img" aria-label="${c.pct}%"><i style="width:${c.pct}%"></i></div><p class="note">${esc(obsFor(c))}</p></div>`).join('')}</div></section>
   <section class="card"><div class="row"><button class="btn primary" id="btn-pdf" ${dlOK?'':'disabled'}>${I.download} Download PDF</button><button class="btn ghost" id="btn-reset">Reset progress</button></div>
    <p id="rmsg" class="note" style="margin-top:10px">${dlOK?'The PDF is ready to upload to Classroom.':'Download is available when the page is opened inside Claude.'}</p>
    <p class="note" style="margin-top:6px">Informe orientativo de práctica autónoma. La calificación oficial corresponde al profesorado.</p></section></div>`;
}

/* ---------- Event delegation ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-go],[data-act],[data-f],[data-say]');if(!t)return;
  if(t.dataset.nav){go(t.dataset.nav);return}
  if(t.dataset.go){
    const g=t.dataset.go;
    if(g==='t1'||g==='t2'){if(t.classList.contains('locked'))return;openLesson('read',g)}
    else if(g==='vocab')go('vocab');else if(g==='report')go('report');
    return;
  }
  if(t.dataset.act==='vpractice'){openLesson('vocab');return}
  if(t.dataset.f){window.__vf=t.dataset.f;render();return}
  if(t.dataset.say!==undefined){const v=V[+t.dataset.say];speak([v.w.replace(/^to /,''),v.ex])}
});
document.addEventListener('input',e=>{
  if(e.target.id==='in-name'){S.name=e.target.value;save()}
  if(e.target.id==='in-course'){S.course=e.target.value;save()}
});

/* ---------- Lesson engine ---------- */
let L=null;
const mkMC=(q,opts,ans,extra)=>{const o=shuffle(opts);return Object.assign({t:'mc',c:'v',q,o,a:o.indexOf(ans),why:''},extra)};
function buildVocab(){
  const pool=shuffle(V);const out=[];
  const distract=(w)=>shuffle(V.filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.w);
  pool.slice(0,4).forEach(w=>out.push(mkMC('Which word or phrase means: "'+w.d+'"?',[w.w].concat(distract(w)),w.w,{tag:'Meaning',why:`${w.w} = ${w.es}. Example: ${w.ex}`})));
  pool.filter(w=>w.key).slice(4,8).forEach(w=>{
    const gap=w.ex.replace(new RegExp(w.key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____');
    out.push(mkMC(gap,[w.w].concat(distract(w)),w.w,{tag:'Fill the gap',why:`Correct sentence: ${w.ex}`}));
  });
  shuffle(PREP).slice(0,2).forEach(p=>out.push(mkMC(p.s.replace('___','_____'),p.o,p.a,{tag:'Preposition',why:`Correct sentence: ${p.s.replace('___',p.a)}`})));
  const lw=pool.filter(w=>!out.some(o=>o.why.includes(w.w+' =')||o.why.includes(w.ex))).slice(0,2);
  lw.forEach(w=>out.push(mkMC(TTS?'Listen to Copy and choose the word you hear.':'Which word means "'+w.es+'"?',[w.w].concat(distract(w)),w.w,{tag:TTS?'Listening':'Meaning',audio:TTS?w.w.replace(/^to /,''):'',why:`${w.w} = ${w.es}. Example: ${w.ex}`})));
  return shuffle(out).slice(0,12);
}
function openLesson(kind,id){
  stopSpeak();
  if(kind==='read'){const T=TEXTS.find(x=>x.id===id);L={kind,T,stage:'read',i:0,qs:T.q,answers:[],streak:0,xp:0,sel:null,checked:false,ok:null,showText:false}}
  else L={kind,T:null,stage:'quiz',i:0,qs:buildVocab(),answers:[],streak:0,xp:0,sel:null,checked:false,ok:null,showText:false};
  const el=$('#lesson');el.hidden=false;document.body.style.overflow='hidden';drawLesson();
}
function closeLesson(){stopSpeak();L=null;const el=$('#lesson');el.hidden=true;el.innerHTML='';document.body.style.overflow='';render()}
function textHtml(T){return `<div class="textcard"><h2>${esc(T.title)}</h2><p>${T.s.map((s,i)=>`<span class="sent"><sup>${i+1}</sup>${esc(s)} </span>`).join('')}</p></div>`}
function listenBtn(){return TTS?`<button class="btn sun" id="btn-listen"></button><button class="btn ghost" id="btn-slow" aria-pressed="${SLOW}">${SLOW?'Slow: on':'Slow: off'}</button>`:'<p class="note">Your browser has no speech voice, so Copy cannot read aloud here.</p>'}
function textPanel(){
  return `<aside class="textpanel"><div class="tphead">${copySvg(L.stage==='read'?130:90)}${L.stage==='read'?`<div class="bubble">Read the text, or press listen and I will read it to you.</div>`:''}</div>${textHtml(L.T)}<div class="row" style="margin-top:12px">${listenBtn()}</div></aside>`;
}
function drawLesson(){
  const el=$('#lesson');
  const head=(pct)=>`<div class="lhead"><button class="xbtn" id="btn-x" aria-label="Exit lesson">${I.x}</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div><span class="pill">${I.bolt}${L.xp}</span></div>`;
  if(L.stage==='read'){
    el.innerHTML=head(0)+`<div class="lscroll"><div class="lbody readonly">${textPanel()}</div></div><div class="lfoot"><div class="lfoot-in"><span class="note">${L.T.kicker} · ${L.T.s.join(' ').split(/\s+/).length} words</span><button class="btn primary" id="btn-start">Start questions</button></div></div>`;
    const b=$('#btn-listen');if(b)refreshListen(b);
    return;
  }
  if(L.stage==='done'){drawDone(head(100));return}
  const two=L.kind==='read';
  el.innerHTML=head(L.i/L.qs.length*100)+`<div class="lscroll"><div class="lbody ${two?'two':''} ${L.showText?'showtext':''}" id="lbody">${two?textPanel():''}<section class="qpanel" id="qarea"></section></div></div><div class="lfoot" id="lfoot"></div>`;
  const b=$('#btn-listen');if(b)refreshListen(b);
  drawQ();
}
function secLabel(q){return q.tag||(q.t==='mc'?'Multiple choice':q.t==='tf'?'True or false':'Find the word')}
function drawQ(){
  const q=L.qs[L.i];const a=$('#qarea');let h='';
  const toggle=L.kind==='read'?`<button class="btn ghost toggletext" id="btn-showtext" style="justify-self:start;min-height:40px;padding:6px 14px">${I.book} ${L.showText?'Hide text':'Show text'}</button>`:'';
  h+=`<div class="row" style="justify-content:space-between"><span class="chip">${secLabel(q)} · ${L.i+1}/${L.qs.length}</span>${toggle}</div>`;
  if(q.t==='mc'){
    h+=`<h2>${esc(q.q)}</h2>`;
    if(q.audio)h+=`<button class="btn sun" id="btn-word" style="justify-self:start">${I.speaker} Play word</button>`;
    h+=`<div class="opts" role="radiogroup" aria-label="Answers">${q.o.map((o,i)=>{let c='opt';if(L.checked){if(i===q.a)c+=' right';else if(i===L.sel)c+=' wrong'}else if(i===L.sel)c+=' sel';return `<button class="${c}" role="radio" aria-checked="${i===L.sel}" data-opt="${i}" ${L.checked?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
  }else if(q.t==='tf'){
    h+=`<h2>${esc(q.q)}</h2><div class="tf" role="radiogroup" aria-label="True or false">${[true,false].map(v=>{let c='opt';if(L.checked){if(v===q.a)c+=' right';else if(v===L.sel)c+=' wrong'}else if(v===L.sel)c+=' sel';return `<button class="${c}" role="radio" aria-checked="${v===L.sel}" data-tf="${v}" ${L.checked?'disabled':''}>${v?'True':'False'}</button>`}).join('')}</div>`;
  }else{
    const len=q.a[0].length;
    h+=`<p class="clue">Find a word in the text that means: <span style="color:var(--leaf)">${esc(q.clue)}</span></p><p class="hint">Look at sentence ${q.sent}. It starts with "${q.a[0][0]}" and has ${len} letters.</p><label class="f" for="syn">Your answer<input id="syn" class="syn ${L.checked?(L.ok?'right':'wrong'):''}" autocomplete="off" autocapitalize="none" spellcheck="false" ${L.checked?'disabled':''} value="${esc(L.val||'')}"></label>`;
  }
  a.innerHTML=h;
  const f=$('#lfoot');
  if(!L.checked){
    f.className='lfoot';f.innerHTML=`<div class="lfoot-in"><span></span><button class="btn primary" id="btn-check" disabled>Check</button></div>`;
    syncCheck();
    const inp=$('#syn');if(inp&&window.matchMedia('(min-width:700px)').matches)inp.focus();
  }else{
    const ok=L.ok;f.className='lfoot '+(ok?'ok':'bad');
    const right=q.t==='mc'?q.o[q.a]:q.t==='tf'?(q.a?'True':'False'):q.a[0];
    f.innerHTML=`<div class="lfoot-in"><div class="fb" aria-live="polite"><b>${ok?'Correct!':'Not quite.'}${ok&&L.streak>=3?' '+L.streak+' in a row!':''}</b><span>${ok?'':'Answer: '+esc(right)+'. '}${esc(q.why||'')}</span></div><button class="btn ${ok?'primary':'bad'}" id="btn-next">${L.i+1>=L.qs.length?'Finish':'Continue'}</button></div>`;
    const nb=$('#btn-next');if(nb)nb.focus();
  }
}
function syncCheck(){
  const q=L.qs[L.i];const b=$('#btn-check');if(!b)return;
  const ready=q.t==='syn'?(($('#syn')||{}).value||'').trim().length>0:L.sel!==null;
  b.disabled=!ready;
}
function doCheck(){
  const q=L.qs[L.i];let ok=false;
  if(q.t==='mc')ok=L.sel===q.a;
  else if(q.t==='tf')ok=L.sel===q.a;
  else{const v=norm($('#syn').value);L.val=$('#syn').value;ok=q.a.some(x=>v===x||v===x+' by')}
  L.checked=true;L.ok=ok;L.answers.push({c:q.c,ok});
  if(ok){L.streak++;L.xp+=10+(L.streak>=3?5:0)}else L.streak=0;
  beep(ok);copyMood(ok?'happy':'oops');
  const px=$('.lhead .pill');if(px)px.innerHTML=I.bolt+L.xp;
  drawQ();
}
function doNext(){
  L.i++;L.sel=null;L.checked=false;L.ok=null;L.val='';
  if(L.i>=L.qs.length){finishLesson();return}
  const bar=$('.bar i');if(bar)bar.style.width=(L.i/L.qs.length*100)+'%';
  drawQ();
  const sc=$('.lscroll');if(sc)sc.scrollTop=0;
}
function finishLesson(){
  const correct=L.answers.filter(a=>a.ok).length,total=L.qs.length;
  touchDay();S.xp+=L.xp;
  if(L.kind==='read')S.results[L.T.id]={correct,total,answers:L.answers,xp:L.xp,date:new Date().toISOString()};
  else S.vocab={correct,total,date:new Date().toISOString()};
  save();L.stage='done';L.correct=correct;L.total=total;stopSpeak();drawLesson();beep(true);copyMood('happy');
}
function drawDone(headHtml){
  const c=L.correct,t=L.total,p=c/t;
  const msg=p>=.9?'Purr-fect! You are a reading star.':p>=.7?'Great work! Almost perfect.':p>=.5?'Good effort. Read again and try to beat your score.':'Keep going. Practice makes you stronger.';
  const rev=L.qs.map((q,i)=>{const ok=L.answers[i].ok;const txt=q.t==='syn'?`${q.clue} → ${q.a[0]}`:q.q;return `<div class="${ok?'y':'n'}">${ok?I.check:I.x}<span>${esc(txt)}</span></div>`}).join('');
  const next=L.kind==='read'&&L.T.id==='t1'?`<button class="btn primary" id="btn-after" data-after="t2">Go to Reading 2</button>`:L.kind==='read'?`<button class="btn primary" id="btn-after" data-after="report">See my report</button>`:`<button class="btn primary" id="btn-after" data-after="vocab">Back to words</button>`;
  $('#lesson').innerHTML=headHtml+`<div class="lscroll"><div class="done">${copySvg(150)}<h1 style="font-size:2rem">${msg}</h1><div class="score">${c}/${t}</div>${stars(c,t)}<div class="stats"><span class="stat">${I.bolt.replace('<svg','<svg width="18" height="18" style="display:inline;vertical-align:-3px"')} +${L.xp} XP</span><span class="stat">${Math.round(p*100)}%</span></div><div class="row" style="justify-content:center">${next}<button class="btn ghost" id="btn-retry">Try again</button><button class="btn ghost" id="btn-home">Back to path</button></div><details class="review"><summary class="btn ghost" style="display:inline-flex;list-style:none">Review answers</summary><div style="display:grid;gap:8px;margin-top:10px">${rev}</div></details></div></div>`;
}
document.addEventListener('click',e=>{
  if(!L)return;
  const t=e.target.closest('button,summary');if(!t)return;
  const id=t.id;
  if(id==='btn-x'){closeLesson();return}
  if(id==='btn-start'){L.stage='quiz';stopSpeak();drawLesson();return}
  if(id==='btn-listen'){if(TALKING)stopSpeak();else speak(L.T.s,{sent:mark});return}
  if(id==='btn-slow'){SLOW=!SLOW;t.setAttribute('aria-pressed',SLOW);t.textContent=SLOW?'Slow: on':'Slow: off';return}
  if(id==='btn-showtext'){L.showText=!L.showText;$('#lbody').classList.toggle('showtext',L.showText);t.innerHTML=I.book+' '+(L.showText?'Hide text':'Show text');return}
  if(id==='btn-word'){speak([L.qs[L.i].audio]);return}
  if(id==='btn-check'){doCheck();return}
  if(id==='btn-next'){doNext();return}
  if(id==='btn-retry'){const k=L.kind,i=L.T&&L.T.id;openLesson(k,i);return}
  if(id==='btn-home'){closeLesson();return}
  if(id==='btn-after'){const a=t.dataset.after;closeLesson();if(a==='t2')openLesson('read','t2');else go(a);return}
  if(t.dataset.opt!==undefined&&!L.checked){L.sel=+t.dataset.opt;drawQ();return}
  if(t.dataset.tf!==undefined&&!L.checked){L.sel=t.dataset.tf==='true';drawQ();return}
});
document.addEventListener('input',e=>{if(L&&e.target.id==='syn')syncCheck()});
document.addEventListener('keydown',e=>{
  if(!L||L.stage!=='quiz')return;
  if(e.key==='Enter'){
    if(L.checked){doNext();e.preventDefault()}
    else{const b=$('#btn-check');if(b&&!b.disabled){doCheck();e.preventDefault()}}
  }else if(!L.checked&&!(e.target&&e.target.id==='syn')){
    const q=L.qs[L.i];
    if(q.t==='mc'&&/^[1-4]$/.test(e.key)&&q.o[+e.key-1]!==undefined){L.sel=+e.key-1;drawQ()}
    if(q.t==='tf'&&/^[tf]$/i.test(e.key)){L.sel=e.key.toLowerCase()==='t';drawQ()}
  }
});

/* ---------- Report PDF ---------- */
let DL=null;
(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(e){DL=null}if(view==='report')render()})();
function slug(s){return (s||'alumno').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function makePdf(){
  if(!window.jspdf)throw new Error('pdf-lib');
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const R=report();const W=210,M=16;let y=0;
  const date=new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
  const ensure=h=>{if(y+h>284){doc.addPage();y=18}};
  doc.setFillColor(39,132,58);doc.rect(0,0,W,34,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(21);doc.text('Copy Reading Quest',M,15);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.text('Informe de comprensión lectora · Inglés 2º Bachillerato (LOMLOE, Andalucía) · Nivel B2',M,25);
  y=46;doc.setTextColor(30,43,26);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(S.name||'Alumno/a sin nombre',M,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(86,102,80);y+=6;doc.text((S.course?'Curso: '+S.course+'   ':'')+'Fecha: '+date,M,y);
  const col=LVLCOL[R.lvl]||[39,132,58];
  doc.setFillColor(col[0],col[1],col[2]);doc.circle(W-M-17,52,17,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(22);doc.text(R.grade.toFixed(1).replace('.',','),W-M-17,55,{align:'center'});
  doc.setTextColor(col[0],col[1],col[2]);doc.setFontSize(12);doc.text(R.lvl,W-M-17,76,{align:'center'});
  doc.setTextColor(86,102,80);doc.setFont('helvetica','normal');doc.setFontSize(9.5);
  y+=8;doc.text(`Nota sobre 10: ${R.correct} de ${R.total} aciertos${R.partial?' (provisional: falta una lectura)':''}`,M,y);
  y=84;doc.setDrawColor(211,225,192);doc.line(M,y,W-M,y);
  y+=9;doc.setTextColor(30,43,26);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Resultados por texto',M,y);
  y+=7;doc.setFontSize(10);
  TEXTS.forEach(T=>{const r=S.results[T.id];doc.setFont('helvetica','normal');doc.setTextColor(30,43,26);doc.text(T.title,M,y);doc.text(r?`${r.correct}/${r.total}`:'-',120,y);doc.text(r?(r.correct/r.total*10).toFixed(1).replace('.',','):'Pendiente',150,y);y+=6});
  doc.setTextColor(86,102,80);doc.text('Vocabulary booster (práctica, no cuenta en la nota)',M,y);doc.text(S.vocab?`${S.vocab.correct}/${S.vocab.total}`:'-',120,y);y+=10;
  doc.setTextColor(30,43,26);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Valoración por criterios de evaluación',M,y);y+=5;
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(86,102,80);
  doc.text('Competencia específica 1 de Lengua Extranjera en 2º de Bachillerato: comprender e interpretar textos escritos.',M,y);y+=8;
  R.crit.forEach(c=>{
    ensure(30);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(30,43,26);
    doc.text(`Criterio ${c.code} · ${c.title}`,M,y);
    doc.text(c.t?`${c.c}/${c.t} · ${c.lvl}`:'Sin datos',W-M,y,{align:'right'});y+=3.5;
    doc.setFillColor(225,235,215);doc.roundedRect(M,y,W-2*M,3.4,1.7,1.7,'F');
    const cc=LVLCOL[c.lvl]||[150,150,150];if(c.pct>0){doc.setFillColor(cc[0],cc[1],cc[2]);doc.roundedRect(M,y,Math.max(3.4,(W-2*M)*c.pct/100),3.4,1.7,1.7,'F')}
    y+=8;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(86,102,80);
    const lines=doc.splitTextToSize(obsFor(c),W-2*M);doc.text(lines,M,y);y+=lines.length*4.4+5;
  });
  ensure(22);y+=2;doc.setDrawColor(211,225,192);doc.line(M,y,W-M,y);y+=6;
  doc.setFontSize(8);doc.setTextColor(120,130,115);
  const foot=doc.splitTextToSize('Informe orientativo generado en práctica autónoma. Escala: Insuficiente (0-4,9), Suficiente (5-5,9), Bien (6-6,9), Notable (7-8,9), Sobresaliente (9-10). La calificación oficial corresponde al profesorado.',W-2*M);
  doc.text(foot,M,y);
  return doc.output('blob');
}
function bindReport(){
  const b=$('#btn-pdf'),m=$('#rmsg'),r=$('#btn-reset');
  if(b)b.addEventListener('click',async()=>{
    if(!DL)return;
    try{
      const blob=makePdf();
      await DL.save({filename:`informe-lectura-${slug(S.name)}.pdf`,data:blob});
      m.textContent='PDF saved. You can upload it to Classroom.';
    }catch(err){
      const code=err&&err.code;
      m.className='msg';
      m.textContent=code==='declined'?'The PDF was not saved. Press the button again when you are ready.':code==='rate_limited'?'Wait a moment and try again.':(err&&err.message==='pdf-lib')?'The PDF tool did not load. Reload the page and try again.':'The PDF could not be saved from here.';
    }
  });
  if(r){let armed=false,tm=0;r.addEventListener('click',()=>{
    if(!armed){armed=true;r.textContent='Press again to confirm';tm=setTimeout(()=>{armed=false;r.textContent='Reset progress'},4000);return}
    clearTimeout(tm);S.results={};S.vocab=null;S.xp=0;save();render();
  })}
}
function bindVocab(){}
window.addEventListener('pagehide',stopSpeak);
render();
})();
